# SonarQube Cloud analysis configuration
# Project: https://sonarcloud.io/project/overview?id=D4id4los_ltc-timecode-generator
sonar.projectKey=D4id4los_ltc-timecode-generator
sonar.organization=d4id4los
sonar.projectName=ltc-timecode-generator

# Analyzed source: the four workspace Rust crates + the legacy React web app.
# The excluded src-tauri/ and src-tauri-32bit/ are legacy standalone crates.
sonar.sources=audio-core/src,gui-engine/src,ltc-gui/src,ltc-slint/src,src

# Test code (gui-engine integration suites + web vitest specs).
# audio-core has no tests/ directory — its unit tests are in-crate under src/.
sonar.tests=src,gui-engine/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests/**/*.rs

# Slint UI markup has no Sonar analyzer; dist/node_modules are build output
sonar.exclusions=**/*.slint,dist/**,**/node_modules/**

# External reports produced by CI (.github/workflows/ci.yml).
# Rust coverage has a language-specific property (sonar.rust.lcov.reportPaths);
# the generic sonar.coverage.lcovReportPaths is honored by the TS analyzer.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.lcovReportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
