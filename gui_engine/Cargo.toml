[package]
name = "gui-engine"
version = "0.3.2"
description = "Shared GUI engine glue for the LTC Timecode Generator — owns AudioCore + state, drives egui and Slint frontends"
authors = ["Daidalos"]
edition = "2021"
rust-version = "1.77.2"

[lints]
workspace = true

[lib]
name = "gui_engine"

[dependencies]
audio-core = { path = "../audio-core" }
arc-swap = "1.7"
chrono = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
hound = "3.5"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"