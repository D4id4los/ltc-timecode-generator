name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual dispatch — makes any branch runnable without a PR (pre-PR
  # validation, deliberate runner-image rehearsal runs such as the
  # ubuntu-24.04→26 migration).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    # Pinned: ubuntu-latest flips to Ubuntu 26 on 2026-10-19; meet the new
    # distro deliberately, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
      # secrets are not readable in step-level `if:` expressions, so the
      # token is mapped here and the scan step checks this variable instead
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs full history for blame-based new-code analysis
          fetch-depth: 0

      - name: Install system dependencies (alsa, pipewire, pulse, fontconfig, libltc, libclang, ffmpeg)
        # resilient-apt: bounded retries + .deb cache against degraded
        # azure.archive.ubuntu.com nodes (see the action's description).
        # timeout-minutes is the fail-fast backstop — composite steps
        # cannot declare it, so it lives here on every caller.
        timeout-minutes: 30
        uses: ./.github/actions/resilient-apt
        with:
          packages: libasound2-dev libpipewire-0.3-dev libpulse-dev libfontconfig1-dev libltc-dev libclang-dev ffmpeg

      # WP-T7 guardrail: needs only python3 (preinstalled), so it runs
      # before any toolchain install and reds the PR cheapest-first.
      - name: Test-lint guardrails (sleep / text-pin rules)
        run: |
          bash scripts/test-lint.sh --self-test
          bash scripts/test-lint.sh

      - name: Install Rust toolchain (stable, clippy, llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Clippy (JSON report for Sonar)
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json

      - name: Clippy gate (-D warnings)
        # Native enforcement: clippy findings reach Sonar only as external
        # issues, which do not feed the LTC gate's ratings — warnings must
        # red the build directly. Second invocation is ~free (warm cache).
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (nextest, ci retry profile, coverage instrumentation)
        run: cargo llvm-cov nextest --workspace --profile ci

      - name: Generate LCOV coverage report for Sonar
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: gui-engine tests under extreme timezone (UTC+14)
        # CI runners are TZ=UTC; the chrono Local sites (offload ISO-date
        # folders, log timestamps, clock display) never cross a date
        # boundary there. Uses the llvm-cov variant to reuse the
        # instrumented build (no rebuild). MUST stay after the LCOV report
        # step: cargo-llvm-cov resets coverage data on every run.
        env:
          TZ: Pacific/Kiritimati
        run: cargo llvm-cov nextest -p gui-engine --profile ci

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        # Gate enforcement (WP-5): the step blocks until the "LTC gate"
        # quality gate is computed, so a gate-failing push/PR reds CI.
        # The scan is the last step — clippy/tests have fully run by then.
        # Reverting to advisory-only = delete the args line.
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Overall-code quality gate (ratings A, duplication < 3%, hotspots 100% reviewed)
        # Overall-code conditions cannot ride the assigned built-in gate
        # (custom-gate assignment 403s on this plan, and "Sonar way" is
        # new-code only).  This CI step is the overall-code enforcement:
        # it queries the project-level measures after the scan and fails
        # the job on any violation.  Main-branch invariant — PR analyses
        # already enforce new code via qualitygate.wait above.
        # Reverting to new-code-only enforcement = delete this step.
        if: ${{ github.ref == 'refs/heads/main' && env.SONAR_TOKEN != '' }}
        run: bash scripts/sonar-overall-gate.sh

  # Enforce the rust-version assertions in the member manifests — a
  # declaration, not enforcement; nothing else compiles with the MSRV.
  # Check-only: no tests, no link. MSRV is 1.92 because egui/eframe 0.35
  # (the primary GUI dependency) requires rustc 1.92 — the former 1.77.2
  # assertion was stale and could never resolve with the current lockfile.
  # If a dep bump breaks MSRV resolution, fix with
  # `cargo update -p <crate> --precise <ver>` pins, not by raising the MSRV.
  msrv-check:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (alsa, pipewire, pulse, fontconfig, libltc, libclang)
        # bindgen runs at check time, so libclang + libltc headers are needed
        timeout-minutes: 30
        uses: ./.github/actions/resilient-apt
        with:
          packages: libasound2-dev libpipewire-0.3-dev libpulse-dev libfontconfig1-dev libltc-dev libclang-dev

      - name: Install Rust toolchain (MSRV 1.92)
        uses: dtolnay/rust-toolchain@1.92

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-check

      - name: cargo check (MSRV 1.92)
        run: cargo check --workspace --all-targets

  # RustSec advisory gate: lockfile-only scan, no toolchain, no build.
  # Ignored advisories in deny.toml each carry a justification + revisit
  # date — triage findings, never blanket-ignore.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: cargo-deny (RustSec advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action's CLI plumbing changed: `arguments` no longer lands
          # after the implicit `check` subcommand. `command-arguments` is
          # the per-command input and produces `cargo deny check advisories`.
          command-arguments: advisories

  # Compile-check the Windows-only cfg blocks (offload win_driver, subprocess
  # console suppression) that the Linux job never builds. Check-only: no
  # link, no tests. The full test suite on windows-latest runs in the
  # windows-tests job below; this stays as the fast per-PR compile guard.
  windows-cross-check:
    runs-on: ubuntu-24.04
    env:
      BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu: -I/usr/include
    steps:
      - uses: actions/checkout@v5

      - name: Install cross toolchain (mingw-w64 x86-64, libltc headers, libclang)
        # resilient-apt (bounded retries + .deb cache) instead of the bare
        # 10-min step timeout from 69a36b9: this job downloads 173 MB in a
        # handful of huge mingw debs — the worst case for the degraded
        # azure-mirror nodes that stall apt (actions/runner-images#14823).
        # Only the x86-64 toolchain: the full `mingw-w64` meta-package
        # drags in the entire i686 toolchain (~half the download) that the
        # x86_64-pc-windows-gnu target never uses.
        timeout-minutes: 30
        uses: ./.github/actions/resilient-apt
        with:
          packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 libltc-dev libclang-dev

      - name: Install Rust toolchain (stable, windows-gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo build (windows target)
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-check

      - name: cargo check (x86_64-pc-windows-gnu)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  # Compile-check the macOS-only cfg blocks (offload /Volumes card scan,
  # audio-output CoreAudio arm) that no other job builds. Check-only guard,
  # not a first-class test job (G3d decision): the /Volumes block still runs
  # on no CI test. --all-targets compiles the test code too, so the
  # cfg-gated test fixtures get a macOS compile signal. No x86_64 job: both
  # macOS targets compile the same macOS cfg blocks.
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Homebrew deps (libltc, llvm for bindgen)
        # PKG_CONFIG_PATH/LIBCLANG_PATH computed here (not at job level —
        # job env cannot reference GITHUB_ENV) so the job survives
        # runner-image prefix changes (/opt/homebrew vs /usr/local).
        run: |
          brew install libltc llvm
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build (macos target)
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-check

      - name: cargo check (aarch64-apple-darwin)
        run: cargo check --workspace --all-targets

  # Full test suite on the shipped Windows target (G3d / WP-4.6):
  # x86_64-pc-windows-gnu, the same target build-all-rust-targets.sh ships.
  # libltc has no Windows package (no MSYS2/vcpkg port), so it is built
  # from a pinned source release inside an MSYS2 ucrt64 shell (the
  # README.org cross-compile recipe relocated onto the runner) and cached
  # by tag. ffmpeg is installed so the converter integration tests execute
  # instead of loud-skipping. No coverage instrumentation — LCOV/Sonar
  # stay ubuntu-owned.
  windows-tests:
    runs-on: windows-latest
    env:
      LIBLTC_TAG: v1.3.2
      LIBLTC_PREFIX: ${{ github.workspace }}/libltc-prefix
      RUSTFLAGS: -L native=${{ github.workspace }}/libltc-prefix/lib
      # windows-latest images ship LLVM (libclang.dll for bindgen); the
      # verify step falls back to choco if the image ever drops it.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v5

      - name: Configure bindgen include path (forward slashes)
        # bindgen splits BINDGEN_EXTRA_CLANG_ARGS with a POSIX shell-word
        # lexer, which strips backslashes — a `-ID:\a\...\include` value
        # mangles into `-ID:altc...` and ltc.h is never found (regressed
        # on windows-latest when a cold rust-cache let the libltc-rs
        # build script run again). Forward slashes keep the path intact.
        run: |
          $inc = "${{ github.workspace }}/libltc-prefix/include" -replace '\\','/'
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu=-I$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ffmpeg (converter integration tests)
        run: choco install ffmpeg -y

      - name: Install Rust toolchain (stable, windows-gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Verify libclang for bindgen
        run: |
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            Write-Host "libclang.dll not found in image LLVM — installing via choco"
            choco install llvm -y
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Cache libltc prefix (keyed on the pinned release)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/libltc-prefix
          key: libltc-${{ env.LIBLTC_TAG }}-ucrt64

      - name: Provision libltc (MSYS2 ucrt64 source build)
        uses: msys2/setup-msys2@v2
        with:
          release: true
          # UCRT64: MINGW64 (msvcrt) is deprecated by MSYS2; the UCRT64 gcc
          # uses the same x86_64-w64-mingw32 host triple.
          msystem: UCRT64
          update: false
          install: git make autoconf automake libtool mingw-w64-ucrt-x86_64-toolchain

      - name: Build libltc into the job prefix
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          if [ -f "$LIBLTC_PREFIX/lib/libltc.a" ]; then
            echo "libltc cache hit"
            exit 0
          fi
          git clone --depth 1 --branch "$LIBLTC_TAG" https://github.com/x42/libltc.git /tmp/libltc-src
          cd /tmp/libltc-src
          autoreconf -vfi
          ./configure --host=x86_64-w64-mingw32 --prefix="$(cygpath -u "$LIBLTC_PREFIX")" --enable-static --disable-shared
          make -j"$(nproc)"
          make install

      - name: Put the MSYS2 ucrt64 linker on PATH
        # rustc's self-contained mingw only covers its own CRT objects; an
        # external C library needs the mingw gcc as the linker. Set as env
        # from day one so the rust-cache key is stable (RUSTFLAGS/env
        # changes invalidate the cache).
        run: echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache cargo build (windows-tests)
        uses: Swatinem/rust-cache@v2
        with:
          # Suffix bumps with the MSYS2 environment so objects linked
          # against the old CRT never leak into the cache.
          key: windows-tests-ucrt64
          workspaces: |
            .

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (cargo nextest, ci profile, shipped gnu target)
        # --target is essential: without it nextest builds for the host
        # default (x86_64-pc-windows-msvc), where the gnu-suffixed
        # BINDGEN_EXTRA_CLANG_ARGS never applies and the mingw libltc
        # prefix cannot link (job failed on its first runs for exactly
        # this reason). The host default is msvc — windows-latest.
        run: cargo nextest run --workspace --profile ci --target x86_64-pc-windows-gnu 2>&1 | Tee-Object -FilePath nextest-output.txt

      - name: Test-count summary guard
        # "all skipped" must not hide behind green: parse the nextest
        # summary and fail if suspiciously few tests ran.
        run: |
          $line = (Select-String -Path nextest-output.txt -Pattern '(\d+) tests run: (\d+) passed' | Select-Object -Last 1)
          if (-not $line) { throw "no nextest summary line found" }
          Write-Host "SUMMARY: $($line.Line)"
          if ([int]$line.Matches[0].Groups[1].Value -lt 800) { throw "suspiciously few tests ran: $($line.Line)" }

      - name: Test-lint guardrail self-test (platform-independent)
        run: bash scripts/test-lint.sh --self-test
