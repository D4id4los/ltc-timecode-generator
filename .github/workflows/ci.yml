name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
      # secrets are not readable in step-level `if:` expressions, so the
      # token is mapped here and the scan step checks this variable instead
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs full history for blame-based new-code analysis
          fetch-depth: 0

      - name: Install system dependencies (alsa, pipewire, pulse, fontconfig, libltc, libclang, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libpulse-dev libfontconfig1-dev libltc-dev libclang-dev ffmpeg

      - name: Install Rust toolchain (stable, clippy, llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Clippy (JSON report for Sonar)
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json

      - name: Rust tests (nextest, ci retry profile, coverage instrumentation)
        run: cargo llvm-cov nextest --workspace --profile ci

      - name: Generate LCOV coverage report for Sonar
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: npm install
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      # Coverage LCOV is no longer exported here: src/ is Sonar-frozen
      # since WP-5 (see reports/wp5-process-hygiene-plan.md); the local
      # `npm run test:coverage` remains for ad-hoc web-app work.
      - name: Web tests (vitest) — legacy frontend guard
        run: npm test

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        # Gate enforcement (WP-5): the step blocks until the "LTC gate"
        # quality gate is computed, so a gate-failing push/PR reds CI.
        # The scan is the last step — clippy/tests have fully run by then.
        # Reverting to advisory-only = delete the args line.
        with:
          args: -Dsonar.qualitygate.wait=true

  # Compile-check the Windows-only cfg blocks (offload win_driver, subprocess
  # console suppression) that the Linux job never builds. Check-only: no
  # link, no tests — a full windows-latest test job is follow-up F-3/F-4 in
  # reports/wp4-test-gap-closure-plan.md.
  # Deliberately out of scope: an Apple-target cross-check (CoreAudio SDK
  # sysroot from Linux is fragile); the macOS /Volumes scan block stays
  # guarded by review only.
  windows-cross-check:
    runs-on: ubuntu-latest
    env:
      BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu: -I/usr/include
    steps:
      - uses: actions/checkout@v5

      - name: Install cross toolchain (mingw-w64, libltc headers, libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libltc-dev libclang-dev

      - name: Install Rust toolchain (stable, windows-gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo build (windows target)
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-check

      - name: cargo check (x86_64-pc-windows-gnu)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
