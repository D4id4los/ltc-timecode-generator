name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame-based new-code analysis
          fetch-depth: 0

      - name: Install system dependencies (libltc, libclang, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libltc-dev libclang-dev ffmpeg

      - name: Install Rust toolchain (stable, clippy, llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clippy (JSON report for Sonar)
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json

      - name: Rust tests + coverage (nextest, LCOV for Sonar)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --nextest

      - name: npm install
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Web tests + coverage (vitest, LCOV for Sonar)
        run: npm run test:coverage

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
