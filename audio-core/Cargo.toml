[package]
name = "audio-core"
version.workspace = true
description = "Tauri-free LTC timecode + cpal audio core shared by the v2 and v1 (32-bit) frontends."
authors = ["Daidalos"]
edition = "2021"
rust-version = "1.92"

[lints]
workspace = true

[lib]
name = "audio_core"
crate-type = ["rlib"]

[dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
keepawake = "0.6"
ringbuf = "0.5"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thread-priority = "0.5"
hound = "3.5"
libltc-rs = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
proptest = "=1.8.0"

# Keep pipewire enabled for 64-bit targets only
[target.'cfg(not(all(target_os = "linux", target_arch = "x86")))'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }
