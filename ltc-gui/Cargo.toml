[package]
name = "ltc-gui"
version = "0.3.2"
description = "Native Rust GUI for the LTC Timecode Generator"
authors = ["Daidalos"]
edition = "2021"
rust-version = "1.77.2"

[lints]
workspace = true

[dependencies]
gui-engine = { path = "../gui_engine" }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35"