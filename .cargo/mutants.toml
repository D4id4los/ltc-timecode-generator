# cargo-mutants config (.cargo/mutants.toml — the path this tool reads).
# Phase 1 scope: audio-core only (pure logic, fast suite, no subprocesses).
# gui-engine integration tests spawn real ffmpeg and are far too slow to
# re-run per mutant — phase 2 decision is deferred (see
# reports/2026-10-06-quality-tooling-assessment-report.md).
test_tool = "nextest"

# audio_output.rs is the cpal device/stream lifecycle (init, start, stop,
# recovery). Behavior is unobservable from unit tests — it needs a real
# audio device, so its mutants are equivalent by construction (the
# 2026-10-06 baseline produced 93+ survivors there from 205 mutants).
# Excluded from scope; audio_output correctness is covered by the
# CallbackWatchdog virtual-clock unit tests and the engine recovery-ladder
# integration tests instead.
exclude_re = [
    "audio-core/src/audio_output\\.rs",
    # Equivalent: generate_and_push_frame re-derives total_samples = needed/2
    # from its own `needed` argument, which every caller also passes as
    # params.total_samples (needed = total_samples * 2, needed is even). The
    # explicit field is redundant with ..params, so deleting it changes
    # nothing.
    "delete field total_samples from struct crate::ltc_encoder::LtcFrameParams",
    # Equivalent: diff = |audio_elapsed - ltc_elapsed| only gates the edit
    # counter, and the co-required condition ltc_elapsed > 10/fps with
    # audio_secs positive & increasing implies diff > 0.1 under both `-`
    # and `+` — the two operators always yield the same verdict here.
    # (exclude_re is start-anchored — use the full mutant name.)
    "audio-core/src/ltc_decoder.rs:1469:35: replace - with \\+ in analyze_gaps",
    # ── 2026-10-07 chunking-machinery triage (triage report, item 3) ──────
    # Log-only: the condition gates an info! line about non-zero decode
    # channels; the published result is identical either way.
    "audio-core/src/chunked_decode.rs:153:28: replace != with == in decode_ltc_chunked",
    # Branch parity: run_sequential and run_parallel produce identical
    # ChunkResults for every deterministic input (pinned by
    # test_run_parallel_matches_run_sequential); the num_workers==1 choice
    # is unobservable through decode_ltc_chunked, whose pre-cancelled path
    # returns Err(Cancelled) before the merge in both arms.
    "audio-core/src/chunked_decode.rs:185:44: replace <= with > in decode_ltc_chunked",
    # Timing diagnostic: processing_time_ms = elapsed*1000 only feeds the
    # published timing field; the + and / unit-scale mutants are observable
    # solely through wall-clock assertions, which the Test Quality Rules
    # prohibit (no elapsed-time assertions).
    "audio-core/src/chunked_decode.rs:209:68: replace \\* with \\+ in decode_ltc_chunked",
    "audio-core/src/chunked_decode.rs:209:68: replace \\* with / in decode_ltc_chunked",
    "audio-core/src/chunked_decode.rs:232:68: replace \\* with \\+ in decode_ltc_chunked",
    "audio-core/src/chunked_decode.rs:232:68: replace \\* with / in decode_ltc_chunked",
    # Display-only: human-rendered "Chunk N: ..." details line; the typed
    # ChunkSummary fields it mirrors ARE pinned by tests.
    "audio-core/src/chunked_decode.rs:349:5: replace render_chunk_detail -> String with String::new()",
    "audio-core/src/chunked_decode.rs:349:5: replace render_chunk_detail -> String with \"xyzzy\".into()",
    # Tie overwrite: when chunk_first_secs equals first_tc_secs, `<=`
    # overwrites the minimum with the same value — unobservable.
    "audio-core/src/chunked_decode.rs:438:63: replace < with <= in merge_results",
    # Gate parity: valid_frames == 0 yields avg_confidence 0.0 (the > 0
    # guard above), and 0.0 fails both confidence branches — the widened
    # `>=` takes the same NoSyncWord path.
    "audio-core/src/chunked_decode.rs:489:34: replace > with >= in merge_results",
    # ── 2026-10-07 coherent-start triage (triage report, item 2) ──────────
    # Guard parity: both disjuncts are re-guarded inside
    # find_first_coherent_index itself (empty → None via the len < min_run
    # gate with min_run ≥ 1; fps ≤ 0 → None via max_frames = 0 making every
    # timecode invalid), so weakening the outer guard is unobservable.
    "audio-core/src/ltc_decoder\\.rs:1041:29: replace \\|\\| with && in find_first_coherent_index",
    "audio-core/src/ltc_decoder\\.rs:1094:36: replace \\|\\| with && in apply_coherent_first_timecode",

    # ── 2026-10-07 peak/mono wrapper triage (triage report, item 4) ───────
    # Log-only: the condition gates an info! line about the auto-selected
    # channel; the decoded samples are identical either way.
    "audio-core/src/ltc_decoder.rs:565:23: replace != with == in decode_ltc_from_wav",
    # Running-max equivalence: `>` vs `>=` when updating the per-channel
    # peak overwrites with an identical value at a tie — the resulting peak
    # vector is the same.
    "audio-core/src/ltc_decoder.rs:642:22: replace > with >= in scan_channel_peaks_hound",
    "audio-core/src/ltc_decoder.rs:651:22: replace > with >= in scan_channel_peaks_hound",
    "audio-core/src/wav_chunk_reader.rs:166:26: replace > with >= in WavChunkReader::scan_channel_peaks",
    # ── 2026-10-07 batch-2 triage (strategy ladder + quality) ─────────────
    # Mean-centering equivalence: sxy = Σdx·(y ∓ my) and Σdx == 0 by
    # construction of my, so flipping the intercept-side subtraction cannot
    # change the covariance (FP noise only).
    "audio-core/src/ltc_decoder.rs:1271:24: replace - with \\+ in fit_segment_drift",
    # Re-suppressed at current positions (were removed with the stale
    # short-form entries in 29babba): worst_block_drift_frames tracks
    # max(accum_frames) with accum absolute — a tie overwrite writes the
    # same number; the degraded-block severity ((accum−0.5)/0.5).min(1.0)
    # is exactly 0.0 at accum == 0.5.
    "audio-core/src/ltc_decoder.rs:1413:27: replace > with >= in analyze_drift",
    "audio-core/src/ltc_decoder.rs:1423:31: replace > with >= in analyze_drift",
    # Segment-length emptiness: seg_len only gates a loop that is empty for
    # every segment shorter than 3 frames, so end+start vs end−start cannot
    # change the glitch set.
    "audio-core/src/ltc_decoder.rs:1526:31: replace - with \\+ in analyze_glitches",
    # Ramp-boundary parity: at glitch_ratio == 0.001 the ramp term
    # ((ratio−0.001)/0.009) is exactly 0.0, so widening `>` to `>=` adds a
    # zero penalty.
    "audio-core/src/ltc_decoder.rs:1583:21: replace > with >= in quality_score",
    # Running-max equivalence (max tracking): a tie overwrite writes the
    # same value.
    "audio-core/src/ltc_decoder.rs:1874:14: replace > with >= in robust_peak_amplitude",
    # Histogram scale off-by-one/bin quantisation: the interpolated
    # percentile moves by at most one bin width (max/4095 ≈ 0.02 % of peak)
    # — unobservable outside absurdly tight windows.
    "audio-core/src/ltc_decoder.rs:1882:23: replace - with \\+ in robust_peak_amplitude",
    "audio-core/src/ltc_decoder.rs:1882:23: replace - with / in robust_peak_amplitude",
    # Clamp non-binding: (|s|·scale) never exceeds BINS−1, so widening the
    # clamp bound cannot change a bin index.
    "audio-core/src/ltc_decoder.rs:1884:57: replace - with \\+ in robust_peak_amplitude",
    "audio-core/src/ltc_decoder.rs:1884:57: replace - with / in robust_peak_amplitude",
    # Unreachable branch: the winning bin always has count ≥ 1 (seen ≥
    # target implies the current bin contributed), so `count > 0` vs
    # `count == 0` selects the same arm.
    "audio-core/src/ltc_decoder.rs:1895:33: replace > with >= in robust_peak_amplitude",
    # Fraction arithmetic mutants shift the in-bin interpolation by at most
    # one bin width (max/4095 ≈ 0.02 % of peak) — same quantisation margin.
    "audio-core/src/ltc_decoder.rs:1896:21: replace - with / in robust_peak_amplitude",
    "audio-core/src/ltc_decoder.rs:1896:29: replace - with / in robust_peak_amplitude",
]
