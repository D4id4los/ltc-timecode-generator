# cargo-mutants config (.cargo/mutants.toml — the path this tool reads).
# Phase 1 scope: audio-core only (pure logic, fast suite, no subprocesses).
# gui-engine integration tests spawn real ffmpeg and are far too slow to
# re-run per mutant — phase 2 decision is deferred (see
# reports/2026-10-06-quality-tooling-assessment-report.md).
test_tool = "nextest"

# audio_output.rs is the cpal device/stream lifecycle (init, start, stop,
# recovery). Behavior is unobservable from unit tests — it needs a real
# audio device, so its mutants are equivalent by construction (the
# 2026-10-06 baseline produced 93+ survivors there from 205 mutants).
# Excluded from scope; audio_output correctness is covered by the
# CallbackWatchdog virtual-clock unit tests and the engine recovery-ladder
# integration tests instead.
exclude_re = ["audio-core/src/audio_output\\.rs"]
